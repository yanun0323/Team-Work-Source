name:
  en: Matt Pocock
  zh: Matt Pocock
  zh-Hans: Matt Pocock
  ja: Matt Pocock
  ko: Matt Pocock
tools: [read_file, write_file, web_search, run_command]
skills:
  - repo: https://github.com/mattpocock/skills
    ref: main
look:
  skin: "#f2c9a0"
  hair: "#d9d4c7"
  shirt: "#e86f8a"
  pants: "#5b4a3a"
