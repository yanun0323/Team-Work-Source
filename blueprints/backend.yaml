name:
  en: Backend Engineer
  zh: 後端工程師
  zh-Hans: 后端工程师
  ja: バックエンドエンジニア
  ko: 백엔드 엔지니어
tools: [read_file, write_file, web_search, run_command]
skills:
  - path: ~/.agents/
  - path: ~/.team-work/
  - path: ~/.codex/
  - path: ~/.claude/
