name:
  en: Feature development
  zh: 功能開發
  zh-Hans: 功能开发
  ja: 機能開発
  ko: 기능 개발
nodes:
  - id: write-spec
    name:
      en: Write spec
      zh: 撰寫規格
      zh-Hans: 编写规格
      ja: 仕様を書く
      ko: 명세 작성
    prompt:
      en: |-
        Read the task description and images and look at the project's current state and the relevant code, then write the requirements as a spec in your handoff, so later steps can start without asking. Write it to a file in docs/ only when the user explicitly asks. Where the task is unclear in a way that affects the scope or result, ask the user with ask_user.

        The spec includes: the problem, the scope, what is excluded, the main flows, edge and error cases, and acceptance criteria that can be verified one by one. Say what to achieve, not how to implement it.

        Then split the work into a frontend part and a backend part, and define the interface between them (API paths, parameters, responses and error formats), so both can start at once without waiting for each other. Both share one working directory, so state which files each part changes, to keep them from changing the same place.

        In your handoff, include the spec in full, and state each part's work, the interface and any ordering constraints. If a part has no work, say so. Copy the acceptance criteria word for word for the next step.
      zh: |-
        讀懂任務說明和附圖，看過專案現況和相關程式，把需求寫成規格放進交接，讓後面的人不用再問就能動手；使用者明確要求時才另存成 docs/ 裡的檔案。任務沒寫清楚又會影響範圍或結果的地方，用 ask_user 問使用者。

        規格要包含：要解決的問題、範圍、不做的事、主要流程、邊界與錯誤情況，以及可以逐條驗證的驗收條件。只寫要達成什麼，不談實作細節。

        接著把工作拆成前端和後端兩份，並定好兩邊之間的介面（API 路徑、參數、回應和錯誤格式），讓兩邊可以同時開工，不用互相等。兩邊共用同一個工作目錄，所以要分清楚各自改哪些檔案，避免改到同一處。

        交接時附上完整規格，分別寫出前端和後端要做的事、介面定義和先後限制，某一邊沒有工作就明說。把驗收條件原文帶給下一步。
      zh-Hans: |-
        读懂任务说明和附图，看过项目现况和相关代码，把需求写成规格放进交接，让后面的人不用再问就能动手；用户明确要求时才另存成 docs/ 里的文件。任务没写清楚又会影响范围或结果的地方，用 ask_user 问用户。

        规格要包含：要解决的问题、范围、不做的事、主要流程、边界与错误情况，以及可以逐条验证的验收条件。只写要达成什么，不谈实现细节。

        接着把工作拆成前端和后端两份，并定好两边之间的接口（API 路径、参数、响应和错误格式），让两边可以同时开工，不用互相等。两边共用同一个工作目录，所以要分清楚各自改哪些文件，避免改到同一处。

        交接时附上完整规格，分别写出前端和后端要做的事、接口定义和先后限制，某一边没有工作就明说。把验收条件原文带给下一步。
      ja: |-
        タスクの説明と添付画像を読み、プロジェクトの現状と関連するコードを確認してから、要件を仕様として引き継ぎに書き、後のステップが質問せずに始められるようにする。docs/ にファイルとして書くのは、ユーザーが明確に求めたときだけ。タスクが不明確で範囲や結果に影響するところは ask_user でユーザーに聞く。

        仕様に含めるもの：問題、範囲、除外するもの、主な流れ、境界とエラーのケース、一つずつ検証できる受け入れ条件。どう実装するかではなく、何を実現するかを書く。

        そのうえで作業をフロントエンドとバックエンドに分け、その間のインターフェース（API のパス、パラメーター、レスポンス、エラー形式）を定め、両方が互いを待たずに同時に始められるようにする。両者は一つの作業ディレクトリを共有するので、それぞれが変更するファイルを書き、同じ場所を変えないようにする。

        引き継ぎには、仕様の全文を入れ、それぞれの作業、インターフェース、順序の制約を書く。作業のない側があればそう書く。受け入れ条件は次のステップのために原文どおり写す。
      ko: |-
        작업 설명과 첨부 이미지를 읽고 프로젝트의 현재 상태와 관련 코드를 살펴본 뒤, 요구 사항을 명세로 인계에 적어 이후 단계가 묻지 않고 시작할 수 있게 하세요. docs/에 파일로 쓰는 것은 사용자가 명확히 요청할 때만입니다. 작업이 불분명해 범위나 결과에 영향을 주는 부분은 ask_user로 사용자에게 물어보세요.

        명세에는 문제, 범위, 제외하는 것, 주요 흐름, 경계와 오류 상황, 하나씩 검증할 수 있는 인수 기준이 들어갑니다. 어떻게 구현할지가 아니라 무엇을 이룰지를 쓰세요.

        그다음 일을 프런트엔드와 백엔드로 나누고 둘 사이의 인터페이스(API 경로, 매개변수, 응답, 오류 형식)를 정의해, 둘이 서로를 기다리지 않고 동시에 시작할 수 있게 하세요. 둘은 작업 디렉터리 하나를 함께 쓰므로 각각 바꾸는 파일을 적어 같은 곳을 바꾸지 않게 하세요.

        인계에는 명세 전문을 넣고, 각 부분의 작업, 인터페이스, 순서 제약을 적으세요. 작업이 없는 부분이 있으면 그렇다고 적으세요. 인수 기준은 다음 단계를 위해 원문 그대로 옮겨 적으세요.
  - id: backend-development
    name:
      en: Backend development
      zh: 後端開發
      zh-Hans: 后端开发
      ja: バックエンド開発
      ko: 백엔드 개발
    sendBack: false
    prompt:
      en: |-
        Implement the backend from the spec and the interface it defines. Read the existing architecture first, follow the project's conventions, change only what this task needs, and leave frontend files alone.

        Cover every new or changed behavior with tests, including errors and edge cases. Run the tests before you hand off and confirm they pass.

        In your handoff, state what you did, how you verified it and whether the interface changed. If there is no backend work, say why and hand off directly. Copy the acceptance criteria word for word for the next step.
      zh: |-
        照規格和其中定好的介面實作後端。先讀現有架構，沿用專案的慣例，只改這次需要的部分，不要動前端的檔案。

        新增或修改的行為都要有測試，包含錯誤與邊界情況；交接前跑過測試，確認通過。

        交接時寫清楚做了什麼、怎麼驗證，以及介面有沒有變動。這次沒有後端工作就說明原因，直接交接。把驗收條件原文帶給下一步。
      zh-Hans: |-
        照规格和其中定好的接口实现后端。先读现有架构，沿用项目的惯例，只改这次需要的部分，不要动前端的文件。

        添加或修改的行为都要有测试，包含错误与边界情况；交接前跑过测试，确认通过。

        交接时写清楚做了什么、怎么验证，以及接口有没有变动。这次没有后端工作就说明原因，直接交接。把验收条件原文带给下一步。
      ja: |-
        仕様とそこで定めたインターフェースに沿ってバックエンドを実装する。まず既存のアーキテクチャを読み、プロジェクトの慣例に従い、このタスクに必要なところだけを変え、フロントエンドのファイルには手を付けない。

        新しい振る舞いや変わった振る舞いには、エラーと境界のケースも含めてテストを付ける。引き継ぐ前にテストを実行し、通ることを確認する。

        引き継ぎには、やったこと、検証の方法、インターフェースが変わったかどうかを書く。バックエンドの作業がなければ理由を書いてそのまま引き継ぐ。受け入れ条件は次のステップのために原文どおり写す。
      ko: |-
        명세와 그 안에서 정의한 인터페이스에 따라 백엔드를 구현하세요. 먼저 기존 아키텍처를 읽고, 프로젝트 관례를 따르며, 이 작업에 필요한 부분만 바꾸고, 프런트엔드 파일은 건드리지 마세요.

        새로 생기거나 바뀐 동작은 오류와 경계 상황을 포함해 모두 테스트로 다루세요. 인계하기 전에 테스트를 실행해 통과하는지 확인하세요.

        인계에는 한 일, 검증 방법, 인터페이스가 바뀌었는지를 적으세요. 백엔드 작업이 없다면 이유를 적고 바로 인계하세요. 인수 기준은 다음 단계를 위해 원문 그대로 옮겨 적으세요.
  - id: frontend-development
    name:
      en: Frontend development
      zh: 前端開發
      zh-Hans: 前端开发
      ja: フロントエンド開発
      ko: 프런트엔드 개발
    sendBack: false
    prompt:
      en: |-
        Implement the frontend from the spec and the interface it defines. Look at the existing components and styles first, reuse what you can, change only what this task needs, and leave backend files alone.

        Handle loading, empty data and error states. Cover every new or changed behavior with tests. Run the tests and build before you hand off and confirm they pass.

        In your handoff, state what you did, how you verified it and whether the interface changed. If there is no frontend work, say why and hand off directly. Copy the acceptance criteria word for word for the next step.
      zh: |-
        照規格和其中定好的介面實作前端。先看現有元件和樣式，能重用就不新寫，只改這次需要的部分，不要動後端的檔案。

        要處理載入中、空資料和錯誤狀態。新增或修改的行為都要有測試；交接前跑過測試和建置，確認通過。

        交接時寫清楚做了什麼、怎麼驗證，以及介面有沒有變動。這次沒有前端工作就說明原因，直接交接。把驗收條件原文帶給下一步。
      zh-Hans: |-
        照规格和其中定好的接口实现前端。先看现有组件和样式，能重用就不新写，只改这次需要的部分，不要动后端的文件。

        要处理加载中、空数据和错误状态。添加或修改的行为都要有测试；交接前跑过测试和构建，确认通过。

        交接时写清楚做了什么、怎么验证，以及接口有没有变动。这次没有前端工作就说明原因，直接交接。把验收条件原文带给下一步。
      ja: |-
        仕様とそこで定めたインターフェースに沿ってフロントエンドを実装する。まず既存のコンポーネントとスタイルを確認し、使えるものは再利用し、このタスクに必要なところだけを変え、バックエンドのファイルには手を付けない。

        読み込み中、データなし、エラーの状態を扱う。新しい振る舞いや変わった振る舞いにはすべてテストを付ける。引き継ぐ前にテストとビルドを実行し、通ることを確認する。

        引き継ぎには、やったこと、検証の方法、インターフェースが変わったかどうかを書く。フロントエンドの作業がなければ理由を書いてそのまま引き継ぐ。受け入れ条件は次のステップのために原文どおり写す。
      ko: |-
        명세와 그 안에서 정의한 인터페이스에 따라 프런트엔드를 구현하세요. 먼저 기존 컴포넌트와 스타일을 살펴보고, 재사용할 수 있는 것은 재사용하며, 이 작업에 필요한 부분만 바꾸고, 백엔드 파일은 건드리지 마세요.

        로딩, 빈 데이터, 오류 상태를 처리하세요. 새로 생기거나 바뀐 동작은 모두 테스트로 다루세요. 인계하기 전에 테스트와 빌드를 실행해 통과하는지 확인하세요.

        인계에는 한 일, 검증 방법, 인터페이스가 바뀌었는지를 적으세요. 프런트엔드 작업이 없다면 이유를 적고 바로 인계하세요. 인수 기준은 다음 단계를 위해 원문 그대로 옮겨 적으세요.
  - id: acceptance
    name:
      en: Acceptance
      zh: 驗收
      zh-Hans: 验收
      ja: 受け入れ確認
      ko: 인수 확인
    sendBack: false
    prompt:
      en: |-
        Check that the frontend and backend work together and meet the spec. First run the project's tests and build. Then verify each acceptance criterion by actually running the feature, and confirm both sides use the same paths, parameters, responses and error formats. Also try empty data, bad input and repeated actions. Do not change any file in this step.

        For each problem, give the file and line or the steps to reproduce, the expected and actual results, and the severity: must fix, should fix or suggestion.

        In your handoff, give each criterion's result with its evidence, the list of problems and what you did not verify. Copy the acceptance criteria word for word for the next step.
      zh: |-
        確認前後端接得起來、也符合規格。先跑專案的測試和建置，再照驗收條件逐條實際操作功能驗證，並確認兩邊的路徑、參數、回應和錯誤格式一致。也要試空資料、錯誤輸入和重複操作。這一步不修改任何檔案。

        每個問題都寫下檔案與行號或重現步驟、預期結果和實際結果，以及嚴重程度：必須修、應該修或只是建議。

        交接時寫下每條驗收條件的結果和依據、問題清單，以及沒驗到的部分，並把驗收條件原文帶給下一步。
      zh-Hans: |-
        确认前后端接得起来、也符合规格。先跑项目的测试和构建，再照验收条件逐条实际操作功能验证，并确认两边的路径、参数、响应和错误格式一致。也要试空数据、错误输入和重复操作。这一步不修改任何文件。

        每个问题都写下文件与行号或重现步骤、预期结果和实际结果，以及严重程度：必须修、应该修或只是建议。

        交接时写下每条验收条件的结果和依据、问题清单，以及没验到的部分，并把验收条件原文带给下一步。
      ja: |-
        フロントエンドとバックエンドが一緒に動き、仕様を満たしているかを確かめる。まずプロジェクトのテストとビルドを実行する。次に受け入れ条件を一つずつ、機能を実際に動かして検証し、両側のパス、パラメーター、レスポンス、エラー形式がそろっているかを確かめる。空のデータ、不正な入力、繰り返しの操作も試す。このステップではファイルを一切変更しない。

        問題ごとに、ファイルと行または再現手順、期待した結果と実際の結果、重大度（必須修正、修正推奨、提案）を書く。

        引き継ぎには、条件ごとの結果とその証拠、問題の一覧、検証しなかったことを書く。受け入れ条件は次のステップのために原文どおり写す。
      ko: |-
        프런트엔드와 백엔드가 함께 동작하고 명세를 충족하는지 확인하세요. 먼저 프로젝트의 테스트와 빌드를 실행하세요. 그다음 인수 기준을 하나씩 기능을 실제로 실행해 검증하고, 양쪽의 경로, 매개변수, 응답, 오류 형식이 같은지 확인하세요. 빈 데이터, 잘못된 입력, 반복 동작도 시도하세요. 이 단계에서는 어떤 파일도 바꾸지 마세요.

        문제마다 파일과 줄 또는 재현 단계, 기대 결과와 실제 결과, 심각도(필수 수정, 수정 권장, 제안)를 적으세요.

        인계에는 기준마다의 결과와 근거, 문제 목록, 검증하지 않은 것을 적으세요. 인수 기준은 다음 단계를 위해 원문 그대로 옮겨 적으세요.
  - id: fix
    name:
      en: Fix
      zh: 修正
      zh-Hans: 修正
      ja: 修正
      ko: 수정
    sendBack: true
    prompt:
      en: |-
        Fix the problems the acceptance found. Every must-fix item gets fixed. If you think an item should not be fixed, say why. Do not skip it silently. Fix each at its root cause, without widening the scope or refactoring along the way. Do not loosen a test's expectations to make it pass. Cover the fixed behavior with tests, and run the relevant tests and build.

        If the acceptance found no problems, say so and hand off directly. If its report is wrong or too unclear to act on, send it back with what needs checking again.

        In your handoff, state how each item was fixed, and which were not and why. Copy the acceptance criteria word for word for the next step.
      zh: |-
        修正驗收找到的問題。必須修的一定要修；覺得某一項不該修時，寫下理由，不要默默跳過。逐項從根本原因修正，不擴大範圍，也不順手重構。不要為了通過測試而放寬測試的預期。修過的行為要有測試，並實際跑過相關測試和建置。

        驗收沒有找到問題時，寫明這點後直接交接。驗收的結果有錯或不清楚到無法處理時，退回並說明要重新確認什麼。

        交接時逐項寫下怎麼修的、沒修的項目和理由，並把驗收條件原文帶給下一步。
      zh-Hans: |-
        修正验收找到的问题。必须修的一定要修；觉得某一项不该修时，写下理由，不要默默跳过。逐项从根本原因修正，不扩大范围，也不顺手重构。不要为了通过测试而放宽测试的预期。修过的行为要有测试，并实际跑过相关测试和构建。

        验收没有找到问题时，写明这点后直接交接。验收的结果有错或不清楚到无法处理时，退回并说明要重新确认什么。

        交接时逐项写下怎么修的、没修的项目和理由，并把验收条件原文带给下一步。
      ja: |-
        受け入れ確認で見つかった問題を直す。必須修正の項目はすべて直す。直すべきでないと考える項目は理由を書く。黙って飛ばさない。各項目は根本原因で直し、範囲を広げたり、ついでにリファクタリングしたりしない。テストを通すために期待値を緩めない。直した振る舞いにはテストを付け、関連するテストとビルドを実行する。

        受け入れ確認で問題が見つからなかったときは、そう書いてそのまま引き継ぐ。その報告が誤っているか、不明確で対応できないときは、何を確かめ直すべきかを添えて差し戻す。

        引き継ぎには、各項目をどう直したか、直さなかったものとその理由を書く。受け入れ条件は次のステップのために原文どおり写す。
      ko: |-
